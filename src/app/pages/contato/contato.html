<div class="contato-page">
  <app-header></app-header>

  <main class="contato-main">
    <section class="vf-section contato-section">
      <div class="vf-container">
        <h1 class="contato-title">Conta sua ideia pra gente</h1>
        <p class="contato-subtitle">
          iremos analisar sua ideia e entraremos em contato com uma proposta imperdível
        </p>

        <form
          class="contato-form"
          [class.is-loading]="isLoading()"
          [formGroup]="form"
          (ngSubmit)="onSubmit()"
        >
          <div class="form-block">
            <h2 class="block-title">Estou interessado em...</h2>
            <div class="chips-grid">
              <button
                *ngFor="let topic of interestTopics"
                type="button"
                class="chip"
                [class.selected]="isInterestSelected(topic)"
                (click)="toggleInterest(topic)"
              >
                {{ topic }}
              </button>
            </div>
          </div>

          <div class="form-block">
            <div class="fields-grid">
              <label class="field">
                <span class="field-label">Seu nome</span>
                <input class="input" type="text" formControlName="name" placeholder="Seu nome" />
              </label>

              <label class="field">
                <span class="field-label">E-Mail</span>
                <input class="input" type="email" formControlName="email" placeholder="E-Mail" />
              </label>

              <label class="field field-full">
                <span class="field-label">Fala pra gente sobre seu projeto</span>
                <textarea
                  class="textarea"
                  rows="5"
                  formControlName="description"
                  placeholder="Fala pra gente sobre seu projeto"
                ></textarea>
              </label>
            </div>
          </div>

          <div class="form-block">
            <h2 class="block-title">Orçamento (BRL)</h2>
            <div class="chips-row">
              <button
                *ngFor="let option of budgetOptions"
                type="button"
                class="chip"
                [class.selected]="isBudgetSelected(option)"
                (click)="selectBudget(option)"
              >
                {{ option }}
              </button>
            </div>
          </div>

          <div class="form-block">
            <h2 class="block-title">Anexo (opcional)</h2>
            <label class="file">
              <input class="file-input" type="file" (change)="onFileSelected($event)" />
              <span class="file-cta">Adicionar anexo</span>
              <span class="file-name" *ngIf="form.controls.attachment.value as f">{{ f.name }}</span>
            </label>
          </div>

          <div class="actions">
            <app-button
              [label]="isLoading() ? 'Enviando...' : 'Enviar proposta'"
              variant="primary"
              type="submit"
              [disabled]="form.invalid || isLoading()"
            ></app-button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <app-footer></app-footer>

  <div class="modal-backdrop" *ngIf="modalKind() as kind">
    <div class="modal-card" role="dialog" aria-live="assertive">
      <div class="modal-icon" [class.error]="kind !== 'success'">
        <svg
          *ngIf="kind === 'success'"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M9.2 16.2 4.8 11.8 3.4 13.2 9.2 19 21 7.2 19.6 5.8z"
            fill="currentColor"
          />
        </svg>
        <svg
          *ngIf="kind !== 'success'"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M12 2 1 21h22L12 2zm1 14h-2v-2h2v2zm0-4h-2V8h2v4z"
            fill="currentColor"
          />
        </svg>
      </div>
      <h2 class="modal-title">{{ modalTitle() }}</h2>
      <p class="modal-message">{{ modalMessage() }}</p>
      <button
        *ngIf="kind === 'error'"
        type="button"
        class="modal-action"
        (click)="closeModal()"
      >
        Tentar novamente
      </button>
    </div>
  </div>
</div>
